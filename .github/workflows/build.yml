name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: douyin-local

jobs:
  # Fast feedback: does the frontend compile, does the backend parse?
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install server deps
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Syntax check every server module
        working-directory: server
        run: |
          for file in $(find src -name '*.js'); do
            node --check "$file"
          done

      - name: Smoke test the API
        working-directory: server
        env:
          DATA_DIR: ${{ runner.temp }}/douyin-data
          VIDEO_DIRS: ${{ runner.temp }}/douyin-videos
          SCAN_ON_START: 'false'
          PORT: '6688'
        run: |
          mkdir -p "$VIDEO_DIRS"
          node src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:6688/api/health > /dev/null; then break; fi
            sleep 1
          done
          echo "--- /api/health ---"
          curl -sf http://127.0.0.1:6688/api/health
          echo
          echo "--- /api/system/info ---"
          curl -sf http://127.0.0.1:6688/api/system/info | head -c 600
          echo
          echo "--- /api/videos ---"
          curl -sf http://127.0.0.1:6688/api/videos
          echo
          kill $SERVER_PID

  # The Dockerfile has no way to be tested on a machine without Docker, so this
  # job is the only place the built image is ever actually booted. It builds,
  # starts the container against a generated clip, and asserts the things that
  # silently break the product: ffmpeg missing, web assets missing, video folder
  # mounted read-only (uploads/deletes would fail at runtime).
  smoke:
    name: 镜像冒烟（真跑一次容器）
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for local use
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: douyin-local:smoke
          cache-from: type=gha
          provenance: false

      - name: ffmpeg / ffprobe must be inside the image
        run: |
          docker run --rm --entrypoint ffmpeg douyin-local:smoke -version | head -1
          docker run --rm --entrypoint ffprobe douyin-local:smoke -version | head -1

      - name: Generate a test clip with the image's own ffmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/videos/示例合集" "$RUNNER_TEMP/data"
          docker run --rm --entrypoint ffmpeg \
            -v "$RUNNER_TEMP/videos:/out" \
            douyin-local:smoke \
            -v error -y -f lavfi -i "testsrc2=size=540x960:rate=30" -t 3 \
            -c:v libx264 -pix_fmt yuv420p "/out/示例合集/中文名称 测试.mp4"
          ls -la "$RUNNER_TEMP/videos/示例合集"

      - name: Boot the container
        run: |
          docker run -d --name smoke -p 6688:6688 \
            -v "$RUNNER_TEMP/videos:/media/videos" \
            -v "$RUNNER_TEMP/data:/data" \
            -e SCAN_ON_START=true \
            -e LOG_LEVEL=info \
            douyin-local:smoke
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:6688/api/health >/dev/null; then break; fi
            sleep 2
          done
          echo "--- logs ---"
          docker logs smoke

      - name: Assert health, frontend assets and read/write access
        run: |
          set -e
          base=http://127.0.0.1:6688
          curl -sf "$base/api/health"; echo
          # 前端产物必须真的进了镜像，否则打开就是 404
          curl -sf "$base/" | grep -q 'id="app"' || { echo "FAIL: 首页不是前端产物"; exit 1; }
          asset=$(curl -sf "$base/" | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "FAIL: 首页里没有 hashed asset"; exit 1; }
          curl -sf -o /dev/null "$base$asset" || { echo "FAIL: 静态资源取不到 $asset"; exit 1; }
          # 视频目录必须可写，否则网页上传和删除都会 EACCES
          docker exec smoke sh -c 'touch /media/videos/.write-probe && rm -f /media/videos/.write-probe' \
            || { echo "FAIL: /media/videos 不可写"; exit 1; }
          echo "OK: 首页 / 静态资源 / 目录可写"

      - name: Assert scanning, cover extraction and Range support
        run: |
          set -e
          base=http://127.0.0.1:6688
          total=""
          for i in $(seq 1 20); do
            total=$(curl -s "$base/api/system/info" | jq -r '.stats.total')
            [ "$total" = "1" ] && break
            sleep 2
          done
          [ "$total" = "1" ] || { echo "FAIL: 扫描没索引到视频（total=$total）"; docker logs smoke; exit 1; }
          echo "索引到 $total 个视频"

          # 封面是 ffmpeg 抽帧出来的，能出封面说明镜像里的 ffmpeg 链路是通的
          poster=""
          for i in $(seq 1 20); do
            poster=$(curl -s "$base/api/videos" | jq -r '.items[0].hasPoster')
            [ "$poster" = "true" ] && break
            sleep 2
          done
          [ "$poster" = "true" ] || { echo "FAIL: 封面没生成（ffmpeg 链路有问题）"; docker logs smoke; exit 1; }
          echo "封面生成 OK"

          id=$(curl -s "$base/api/videos" | jq -r '.items[0].id')
          curl -s "$base/api/videos/$id/play" | jq .
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-99' "$base/api/stream/$id")
          [ "$code" = "206" ] || { echo "FAIL: Range 请求返回 $code，应为 206"; exit 1; }
          echo "Range OK (206)"

          # 上传接口在只读挂载下会返回 400，这里应成功
          curl -sf -o /dev/null -X POST "$base/api/system/scan" -H 'Content-Type: application/json' \
            -d '{"full":true,"wait":true}'
          echo "OK: 扫描 / 封面 / 播放协商 / Range 全部通过"

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # amd64 only by design: this project targets x86 NAS boxes.
      # Add "linux/arm64" below and a setup-qemu-action step if you need ARM.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # 备用镜像源：把 GHCR 上刚推好的镜像原样同步一份到 Docker Hub。
  # 为什么需要：国内飞牛的「Docker → 镜像加速」只对 docker.io 生效，对 ghcr.io 无效，
  # 而 GHCR 的层请求还要 307 到 pkg-containers.githubusercontent.com（国内基本不通）。
  # 多一份 Docker Hub 就多一条能吃到加速器的路。
  #
  # 没配 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 时**自动跳过**，不会把 CI 弄红。
  # 配置方法：仓库 Settings → Secrets and variables → Actions → New repository secret
  #   DOCKERHUB_USERNAME = 你的 Docker Hub 用户名
  #   DOCKERHUB_TOKEN    = Docker Hub 的 Access Token（Read & Write 权限，不是登录密码）
  image-dockerhub:
    name: 同步到 Docker Hub
    needs: [verify, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: 检查是否配置了 Docker Hub 凭据
        id: gate
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已配置 Docker Hub 凭据，将同步镜像"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过 Docker Hub 同步"
          fi

      - name: Log in to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # 镜像引用必须全小写：github.repository_owner 是 Gaoyubao0917（带大写），
      # 直接拼进 registry 路径会 invalid reference format。
      - name: Pull from GHCR and push to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -e
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          user=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          src="ghcr.io/$owner/${{ env.IMAGE_NAME }}:latest"
          dst="docker.io/$user/${{ env.IMAGE_NAME }}:latest"

          docker pull "$src"
          docker tag "$src" "$dst"
          docker push "$dst"
          echo "已推送 $dst"

          # 打 tag 触发的构建，顺带把版本号也同步过去
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            docker tag "$src" "docker.io/$user/${{ env.IMAGE_NAME }}:$ver"
            docker push "docker.io/$user/${{ env.IMAGE_NAME }}:$ver"
            echo "已推送 docker.io/$user/${{ env.IMAGE_NAME }}:$ver"
          fi

      # 飞牛上是**匿名**拉取，所以必须确认包是公开可读的。
      # 私有仓库（或 Docker Hub 上把仓库设成 private）会在这里被拦下来。
      - name: 断言 Docker Hub 上匿名可拉取
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -e
          user=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          repo="$user/${{ env.IMAGE_NAME }}"
          tok=$(curl -sf "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$repo:pull" | jq -r .token)
          [ -n "$tok" ] && [ "$tok" != "null" ] || { echo "FAIL: 匿名拿不到 pull token，仓库可能是私有的"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry-1.docker.io/v2/$repo/manifests/latest")
          [ "$code" = "200" ] || { echo "FAIL: 匿名读 manifest 返回 $code"; exit 1; }
          echo "OK: docker.io/$repo:latest 匿名可拉取"
